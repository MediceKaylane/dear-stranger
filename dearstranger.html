<!-- OpenAI ChatGPT assistance: Helped draft this early layout. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/favicon.png') }}">

    <title>Dear Stranger</title>
</head>
<body>
     <nav class="navbar navbar-expand-lg bg-white">
        <div class="container">

            <a class="navbar-brand" href="{{ url_for('index') }}">
                Dear Stranger
            </a>

            <div class="d-flex align-items-center gap-4">

                {% if session.get("user_id") %}

                    <a href="{{ url_for('posts.feed') }}" class="nav-link">
                        Feed
                    </a>

                    <a href="{{ url_for('posts.profile') }}" class="nav-link">
                        My Profile
                    </a>

                    <form action="{{ url_for('auth.logout') }}" method="POST" class="m-0">
                        <button type="submit" class="nav-link">
                            Log out
                        </button>
                    </form>

                {% else %}

                    <a href="{{ url_for('auth.login') }}" class="nav-link">
                        Log in
                    </a>

                    <a href="{{ url_for('auth.register') }}" class="nav-link">
                        Sign up
                    </a>

                {% endif %}

            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block main %}{% endblock %}
    </main>

    <footer class="bg-white border-top py-4 w-100">
    </footer>

</body>
</html>
