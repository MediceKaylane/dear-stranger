{% extends "layout.html" %}

{% block main %}

<div class="container mt-5">

    <h1>Your profile</h1>
    <p>
        <a href="{{ url_for('auth.delete_account_route') }}"
            class="text-danger text-decoration-none">
            Delete Account
        </a> <br>

        A collection of words you've shared.
    </p>




    {% for post in posts %}

        <div class="card mb-3">
            <div class="card-body">

                <p>{{ post["content"] }}</p>

                <small class="text-muted">
                    {{ post["created_at"] }}
                </small>

            </div>
        </div>

    {% else %}

        <p>You haven't shared any stories yet.</p>

    {% endfor %}

</div>

{% endblock %}
