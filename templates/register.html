{% extends "layout.html" %}

{% block main %}

<div class="container mt-5">
    <h1>Create an account</h1>

    <form action="{{ url_for('auth.register') }}" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Choose a username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>
</div>

{% endblock %}
